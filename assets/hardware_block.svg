<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================================
     CEE-PEW — Diagram 01: Hardware Block Diagram
     ===
     SOURCE REFERENCES (repository files the technical content was derived from):
       - components/hal/hal_pins.h            (single source of truth for all GPIO
                                                pin assignments, I2C port/freq/addr,
                                                ADC unit/channel/width/atten)
       - components/ceepew_common/ceepew_config.h
         (OLED 128x64: CEEPEW_OLED_WIDTH_PX/HEIGHT_PX; button debounce 25 ms;
          ADC samples 8; ESP-NOW channel 1; BLE/ESP-NOW radio split)
       - main/main.c                          (boot sequence, BLE-only mode,
                                                board tag from BT MAC byte 5)
       - components/transport/transport_ble.h (BLE = pairing phases 1-2 only)
       - README.md                            (hardware table: ESP32 DevKit v1,
                                                SSD1306 128x64 OLED)
     ===
     All pin numbers verified against hal_pins.h. "ESP32 DevKit v1 (CP210x)"
     comes from README.md hardware table.
     ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"
     viewBox="0 0 1920 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#43D9F5"/>
    </marker>
    <marker id="arr-dim" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7E9AAA"/>
    </marker>
    <marker id="arr-amb" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFB454"/>
    </marker>
    <pattern id="grid-minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#12202C" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid-minor)"/>
      <path d="M200 0 L0 0 0 200" fill="none" stroke="#1A2C3B" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C28"/>
      <stop offset="1" stop-color="#0B141D"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="#0A0F16"/>
  <rect width="1920" height="1080" fill="url(#grid-major)"/>

  <!-- title block -->
  <g id="title">
    <rect x="60" y="52" width="8" height="44" fill="#43D9F5"/>
    <text x="84" y="76" font-size="34" fill="#E6F1F7" font-weight="600">CEE-PEW HARDWARE BLOCK DIAGRAM</text>
    <text x="84" y="102" font-size="18" fill="#7E9AAA">CRYPTOGRAPHIC END-TO-END PEER-TO-PEER ENCRYPTED WIRELESS COMMUNICATOR — ESP32 PLATFORM</text>
  </g>

  <!-- ==========================================================================
       CENTER: ESP32 MODULE
       ========================================================================== -->
  <g id="esp32">
    <rect x="620" y="330" width="560" height="430" rx="10" fill="url(#chip)"
          stroke="#43D9F5" stroke-width="2.5"/>
    <text x="900" y="368" font-size="24" fill="#43D9F5" text-anchor="middle" font-weight="600">ESP32 (Xtensa LX6, dual-core)</text>
    <text x="900" y="394" font-size="15" fill="#7E9AAA" text-anchor="middle">ESP32 DevKit v1 — CP210x UART</text>
    <text x="900" y="414" font-size="13" fill="#5C7A8C" text-anchor="middle">target: esp32 (sdkconfig.defaults) · ESP-IDF v6.0.2 (README)</text>

    <!-- internal blocks -->
    <g id="cpu-block">
      <rect x="660" y="435" width="230" height="120" rx="6" fill="#0D1822" stroke="#2E93B0" stroke-width="1.5"/>
      <text x="775" y="462" font-size="17" fill="#E6F1F7" text-anchor="middle" font-weight="600">CPU CORE 0</text>
      <text x="775" y="484" font-size="13" fill="#7E9AAA" text-anchor="middle">task_ui — OLED / input / LED</text>
      <text x="775" y="504" font-size="13" fill="#7E9AAA" text-anchor="middle">10 KB stack · priority 3</text>
      <text x="775" y="524" font-size="13" fill="#7E9AAA" text-anchor="middle">15 ms render loop (~60 Hz)</text>
      <text x="775" y="544" font-size="13" fill="#5C7A8C" text-anchor="middle">(main.c:196 · ceepew_config.h:237)</text>
    </g>
    <g id="cpu-block2">
      <rect x="910" y="435" width="230" height="120" rx="6" fill="#0D1822" stroke="#2E93B0" stroke-width="1.5"/>
      <text x="1025" y="462" font-size="17" fill="#E6F1F7" text-anchor="middle" font-weight="600">CPU CORE 1</text>
      <text x="1025" y="484" font-size="13" fill="#7E9AAA" text-anchor="middle">task_session — FSM / crypto</text>
      <text x="1025" y="504" font-size="13" fill="#7E9AAA" text-anchor="middle">16 KB stack · priority 3</text>
      <text x="1025" y="524" font-size="13" fill="#7E9AAA" text-anchor="middle">BLE · ESP-NOW · ARQ · hop</text>
      <text x="1025" y="544" font-size="13" fill="#5C7A8C" text-anchor="middle">(main.c:206 · ceepew_config.h:238)</text>
    </g>

    <!-- radio block -->
    <g id="radio-block">
      <rect x="660" y="575" width="480" height="100" rx="6" fill="#0D1822" stroke="#2E93B0" stroke-width="1.5"/>
      <text x="900" y="600" font-size="16" fill="#E6F1F7" text-anchor="middle" font-weight="600">2.4 GHz RADIO — TIME-DIVIDED, NEVER CONCURRENT</text>
      <text x="760" y="630" font-size="14" fill="#43D9F5" text-anchor="middle">BLE (Bluedroid)</text>
      <text x="760" y="652" font-size="12" fill="#7E9AAA" text-anchor="middle">Phases 1-2 only · pairing</text>
      <text x="1040" y="630" font-size="14" fill="#43D9F5" text-anchor="middle">WiFi STA + ESP-NOW</text>
      <text x="1040" y="652" font-size="12" fill="#7E9AAA" text-anchor="middle">Phase 3 · session · ch 1 start</text>
      <line x1="810" y1="610" x2="810" y2="660" stroke="#1A2C3B" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <!-- GPIO / peripherals hub -->
    <g id="io-hub">
      <rect x="660" y="695" width="480" height="44" rx="6" fill="#0D1822" stroke="#2E93B0" stroke-width="1.5"/>
      <text x="900" y="723" font-size="14" fill="#E6F1F7" text-anchor="middle" font-weight="600">I2C PORT 1 · ADC1 · GPIO — PERIPHERAL BUS</text>
    </g>
  </g>

  <!-- ==========================================================================
       LEFT: SSD1306 OLED
       ========================================================================== -->
  <g id="oled">
    <rect x="70" y="300" width="330" height="210" rx="10" fill="#0D1822" stroke="#43D9F5" stroke-width="2"/>
    <text x="235" y="334" font-size="20" fill="#E6F1F7" text-anchor="middle" font-weight="600">SSD1306 OLED DISPLAY</text>
    <text x="235" y="358" font-size="14" fill="#7E9AAA" text-anchor="middle">128 × 64 px · 0.96" · I2C</text>
    <rect x="130" y="380" width="210" height="90" rx="4" fill="#06131C" stroke="#2E93B0" stroke-width="1.5"/>
    <text x="235" y="410" font-size="13" fill="#43D9F5" text-anchor="middle">STATUS / CODE ENTRY / CHAT</text>
    <text x="235" y="432" font-size="12" fill="#5C7A8C" text-anchor="middle">render: task_ui (Core 0)</text>
    <text x="235" y="450" font-size="12" fill="#5C7A8C" text-anchor="middle">full-frame I2C push ~6 ms</text>
    <!-- pins -->
    <g id="oled-pins">
      <text x="120" y="548" font-size="14" fill="#43D9F5">SDA → GPIO 26</text>
      <text x="120" y="572" font-size="13" fill="#7E9AAA">(fallback 21 · addr 0x3C)</text>
      <text x="330" y="548" font-size="14" fill="#43D9F5">SCL → GPIO 27</text>
      <text x="330" y="572" font-size="13" fill="#7E9AAA">(fallback 22 · addr 0x3D)</text>
    </g>
    <!-- wire to ESP32 -->
    <path d="M 400 400 L 620 400" stroke="#43D9F5" stroke-width="2.5" fill="none" marker-end="url(#arr-cyan)"/>
    <path d="M 400 445 L 480 445 L 480 740 L 660 740" stroke="#43D9F5" stroke-width="2.5" fill="none" marker-end="url(#arr-cyan)"/>
    <text x="500" y="438" font-size="14" fill="#43D9F5" font-weight="600">I2C1 · 800 kHz</text>
    <text x="500" y="456" font-size="12" fill="#7E9AAA">fallback 400 kHz</text>
  </g>

  <!-- ==========================================================================
       BOTTOM LEFT: INPUTS
       ========================================================================== -->
  <g id="inputs">
    <!-- potentiometer -->
    <rect x="70" y="700" width="310" height="120" rx="8" fill="#0D1822" stroke="#43D9F5" stroke-width="2"/>
    <text x="225" y="730" font-size="18" fill="#E6F1F7" text-anchor="middle" font-weight="600">ROTARY POTENTIOMETER</text>
    <text x="225" y="756" font-size="14" fill="#43D9F5" text-anchor="middle">GPIO 33 — ADC1 CH5</text>
    <text x="225" y="778" font-size="13" fill="#7E9AAA" text-anchor="middle">12-bit · 8-sample average · EMA 0.25</text>
    <text x="225" y="798" font-size="12" fill="#5C7A8C" text-anchor="middle">UI selection / code entry (36-symbol charset)</text>
    <line x1="380" y1="760" x2="620" y2="760" stroke="#43D9F5" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
    <text x="452" y="752" font-size="12" fill="#7E9AAA">ADC1 CH5</text>

    <!-- button -->
    <rect x="70" y="845" width="310" height="100" rx="8" fill="#0D1822" stroke="#43D9F5" stroke-width="2"/>
    <text x="225" y="875" font-size="18" fill="#E6F1F7" text-anchor="middle" font-weight="600">CLICK BUTTON (SPST-NO)</text>
    <text x="225" y="901" font-size="14" fill="#43D9F5" text-anchor="middle">GPIO 19 — INPUT_PULLUP</text>
    <text x="225" y="923" font-size="13" fill="#7E9AAA" text-anchor="middle">active LOW · 25 ms debounce</text>
    <line x1="380" y1="895" x2="620" y2="895" stroke="#43D9F5" stroke-width="2.5" marker-end="url(#arr-cyan)"/>

    <!-- diag switch -->
    <rect x="420" y="845" width="310" height="100" rx="8" fill="#0D1822" stroke="#FFB454" stroke-width="2"/>
    <text x="575" y="875" font-size="18" fill="#E6F1F7" text-anchor="middle" font-weight="600">DIAGNOSTIC SWITCH</text>
    <text x="575" y="901" font-size="14" fill="#FFB454" text-anchor="middle">GPIO 5 — push-lock, active LOW</text>
    <text x="575" y="923" font-size="13" fill="#7E9AAA" text-anchor="middle">dev mode: I2C scan + diagnostics</text>
    <line x1="730" y1="895" x2="900" y2="895" stroke="#FFB454" stroke-width="2" marker-end="url(#arr-amb)"/>
  </g>

  <!-- ==========================================================================
       BOTTOM RIGHT: RGB LED
       ========================================================================== -->
  <g id="rgb">
    <rect x="1120" y="700" width="420" height="190" rx="8" fill="#0D1822" stroke="#43D9F5" stroke-width="2"/>
    <text x="1330" y="734" font-size="18" fill="#E6F1F7" text-anchor="middle" font-weight="600">INDICATOR RGB LED (common-cathode)</text>
    <text x="1330" y="758" font-size="13" fill="#7E9AAA" text-anchor="middle">3 × 220 Ω series resistors to 3.3 V</text>
    <g id="rgb-channels">
      <circle cx="1180" cy="800" r="16" fill="#3A0F12" stroke="#FF5C5C" stroke-width="2"/>
      <text x="1180" y="836" font-size="14" fill="#FF5C5C" text-anchor="middle">R</text>
      <text x="1210" y="804" font-size="14" fill="#E6F1F7">GPIO 15</text>
      <circle cx="1330" cy="800" r="16" fill="#0B1F14" stroke="#7EE0A3" stroke-width="2"/>
      <text x="1330" y="836" font-size="14" fill="#7EE0A3" text-anchor="middle">G</text>
      <text x="1360" y="804" font-size="14" fill="#E6F1F7">GPIO 18</text>
      <circle cx="1480" cy="800" r="16" fill="#0B1626" stroke="#5CA8FF" stroke-width="2"/>
      <text x="1480" y="836" font-size="14" fill="#5CA8FF" text-anchor="middle">B</text>
      <text x="1510" y="804" font-size="14" fill="#E6F1F7">GPIO 23</text>
    </g>
    <text x="1330" y="872" font-size="13" fill="#7E9AAA" text-anchor="middle">state patterns: idle pulse 500 ms · code blink 200 ms · error 300 ms</text>
  </g>

  <!-- ==========================================================================
       RIGHT: ANTENNA / RF
       ========================================================================== -->
  <g id="rf">
    <path d="M 1180 380 L 1480 380 L 1480 560 L 1580 560" stroke="#7E9AAA" stroke-width="2" fill="none"/>
    <text x="1210" y="372" font-size="13" fill="#7E9AAA">2.4 GHz antenna</text>
    <g id="antenna">
      <line x1="1580" y1="560" x2="1580" y2="440" stroke="#43D9F5" stroke-width="3"/>
      <line x1="1560" y1="480" x2="1600" y2="480" stroke="#43D9F5" stroke-width="3"/>
      <line x1="1560" y1="500" x2="1600" y2="500" stroke="#43D9F5" stroke-width="3"/>
      <line x1="1560" y1="520" x2="1600" y2="520" stroke="#43D9F5" stroke-width="3"/>
      <line x1="1560" y1="540" x2="1600" y2="540" stroke="#43D9F5" stroke-width="3"/>
    </g>
    <rect x="1440" y="620" width="300" height="62" rx="6" fill="#0D1822" stroke="#2E93B0" stroke-width="1.5"/>
    <text x="1590" y="646" font-size="14" fill="#E6F1F7" text-anchor="middle" font-weight="600">PAIRING: BLE · SESSION: ESP-NOW</text>
    <text x="1590" y="668" font-size="12" fill="#7E9AAA" text-anchor="middle">ESP-NOW start channel 1 · hop across 9 channels</text>
  </g>

  <!-- ==========================================================================
       BOTTOM NOTES / POWER
       ========================================================================== -->
  <g id="notes">
    <rect x="70" y="970" width="1780" height="74" rx="6" fill="#0C141C" stroke="#223244" stroke-width="1.5"/>
    <text x="90" y="994" font-size="15" fill="#FFB454" font-weight="600">VERIFIED PINOUT — components/hal/hal_pins.h (single source of truth)</text>
    <text x="90" y="1018" font-size="13" fill="#7E9AAA">OLED SDA/SCL GPIO26/27 (I2C1, 800 kHz, addr 0x3C, fallback 21/22 @ 400 kHz, 0x3D) · POT GPIO33 (ADC1 CH5, 12-bit) ·
BUTTON GPIO19 (pull-up, active LOW, 25 ms) · DIAG GPIO5 (pull-up, active LOW) · RGB R/G/B GPIO15/18/23 (220 Ω to 3.3 V)</text>
    <text x="90" y="1036" font-size="12" fill="#5C7A8C">compile-time uniqueness asserts enforce pin conflicts (hal_pins.h CEEPEW_PINS_ASSERT_UNIQUE) · boot: nvs_flash → GPIO → ADC → temp → RNG → OLED → BLE → tasks (main.c)</text>
  </g>

  <!-- footer -->
  <g id="footer">
    <text x="60" y="1062" font-size="13" fill="#5C7A8C">CEE-PEW · 01_HARDWARE_BLOCK · source: components/hal/hal_pins.h · components/ceepew_common/ceepew_config.h · main/main.c · README.md</text>
  </g>
</svg>