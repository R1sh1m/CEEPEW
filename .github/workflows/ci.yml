name: CEE-PEW CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IDF_VERSION: release-v6.0
  IDF_DOCKER_IMAGE: espressif/idf:release-v6.0

jobs:
  # ── Stub-marker check ──────────────────────────────────────────────
  stub-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Stub markers
        run: |
          echo "Scanning repository for Stub markers..."
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          STUBS=$(git grep -I --line-number "Stu[b]:" || true)
          if [ -n "$STUBS" ]; then
            echo "Stub markers found:"
            echo "$STUBS"
            exit 1
          else
            echo "No Stub markers found."
          fi

  # ── Debug firmware build ───────────────────────────────────────────
  build-debug:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug / diagnostic mode)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          source /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-debug
          path: build/ceepew.bin
          retention-days: 5

  # ── Production firmware build ──────────────────────────────────────
  build-production:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build (production)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          source /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.production" reconfigure
          idf.py build
      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-production
          path: build/ceepew.bin
          retention-days: 5

  # ── Fuzz harness smoke tests ───────────────────────────────────────
  # Runs inside the IDF Docker container for ESP-IDF header access.
  fuzz:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + libFuzzer
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          apt-get update && apt-get install -y clang libclang-rt-dev cmake libmbedtls-dev
      - name: Build and smoke-test fuzz harnesses
        run: |
          chmod +x tools/run_fuzz_harnesses.sh
          export IDF_PATH=${IDF_PATH:-/opt/esp/idf}
          bash tools/run_fuzz_harnesses.sh

  # ── Host-compilable unit tests ─────────────────────────────────────
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc libmbedtls-dev
      - name: Configure and build host tests
        run: |
          cmake -S tests/host -B tests/host/build -DCEEPEW_HOST_SANITIZERS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build tests/host/build
      - name: Run host tests (CTest)
        run: |
          ctest --test-dir tests/host/build --output-on-failure

  # ── Static analysis (cppcheck + clang-tidy) ────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy cmake gcc libmbedtls-dev
      - name: Generate compile commands database
        run: |
          cmake -S tests/host -B tests/host/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 \
            --suppressions-list=tools/cppcheck_suppressions.txt \
            --enable=warning,style,performance,portability \
            --std=c11 \
            --inline-suppr \
            -I components/ceepew_common \
            -I components/ceepew_hal \
            -I components/hal \
            -I components/crypto \
            -I components/ecc \
            -I components/transport \
            -I components/mem \
            -I components/compress \
            -i build \
            -i tests \
            -i fuzz \
            -i managed_components \
            -i .agents \
            .
      - name: clang-tidy
        run: |
          find tests/host/ -name '*.c' -print0 | xargs -0 -P$(nproc) clang-tidy \
            --quiet \
            -p tests/host/build || true
